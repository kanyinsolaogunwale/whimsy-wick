name: Deploy to GitHub Pages

# Manual only. Pushing game code should not deploy anything, and the Pages
# site is not enabled yet, so every push-triggered run failed at
# actions/configure-pages. Run this by hand from the Actions tab once Pages
# is switched to Source: GitHub Actions.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # static game: no build step, just stage what the browser loads
      - name: Stage the game
        run: |
          mkdir -p _site
          cp index.html startng.json cover.png _site/
          cp -R css js lib assets _site/

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deploy
        uses: actions/deploy-pages@v4
